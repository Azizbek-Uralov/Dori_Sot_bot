{% extends "base.html" %}
{% block title %}Adminlar{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Adminlar</h1>
  <a class="btn" href="/admins/new">+ Yangi admin</a>
</div>
<table class="table">
  <thead><tr><th>Login</th><th>Ism</th><th>Holat</th><th></th></tr></thead>
  <tbody>
  {% for a in admins %}
    <tr>
      <td>{{ a.username }}</td>
      <td>{{ a.full_name or '—' }}</td>
      <td>{% if a.is_active %}<span class="badge badge-active">Faol</span>{% else %}<span class="badge badge-inactive">Nofaol</span>{% endif %}</td>
      <td class="actions">
        <form method="post" action="/admins/{{ a.id }}/toggle-active">
          <button type="submit">{% if a.is_active %}Nofaol qilish{% else %}Faollashtirish{% endif %}</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
