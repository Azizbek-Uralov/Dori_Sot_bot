services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dorsotbot
      POSTGRES_PASSWORD: dorsotbot
      POSTGRES_DB: dorsotbot
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorsotbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dorsotbot:dorsotbot@db:5432/dorsotbot
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dorsotbot:dorsotbot@db:5432/dorsotbot
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/static/uploads
    command: ["uv", "run", "python", "-m", "bot.main"]

  admin:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dorsotbot:dorsotbot@db:5432/dorsotbot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/static/uploads
    command: ["uv", "run", "uvicorn", "admin.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  db_data:
  uploads:
